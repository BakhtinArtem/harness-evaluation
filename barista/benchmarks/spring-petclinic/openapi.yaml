openapi: 3.0.3
info:
  title: Spring PetClinic API
  description: |
    REST API specification for the Spring PetClinic application.
    This application manages a pet clinic with owners, pets, visits, and veterinarians.
  version: 3.0.0
  contact:
    name: Spring PetClinic
    url: https://github.com/spring-projects/spring-petclinic

servers:
  - url: http://localhost:8006
    description: Local development server
  - url: http://localhost:8006
    description: Default server

paths:
  /:
    get:
      summary: Welcome page
      description: Returns the welcome page
      operationId: welcome
      tags:
        - System
      responses:
        '200':
          description: Welcome page HTML
          content:
            text/html:
              schema:
                type: string

  /oups:
    get:
      summary: Trigger exception
      description: Intentionally throws a RuntimeException for testing error handling
      operationId: triggerException
      tags:
        - System
      responses:
        '500':
          description: Internal server error
          content:
            text/html:
              schema:
                type: string

  /vets:
    get:
      summary: List all veterinarians
      description: Returns a list of all veterinarians in JSON format
      operationId: listVets
      tags:
        - Veterinarians
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vets'
            application/xml:
              schema:
                $ref: '#/components/schemas/Vets'

  /vets.html:
    get:
      summary: List all veterinarians (HTML)
      description: Returns a paginated list of veterinarians in HTML format
      operationId: listVetsHtml
      tags:
        - Veterinarians
      parameters:
        - name: page
          in: query
          description: Page number (default is 1)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        '200':
          description: Successful response
          content:
            text/html:
              schema:
                type: string

  /owners:
    get:
      summary: Find owners
      description: |
        Search for owners by last name. Returns HTML view with search results.
        If no lastName parameter is provided, returns all owners.
        If exactly one owner is found, redirects to owner details.
        If multiple owners are found, returns paginated list.
      operationId: findOwners
      tags:
        - Owners
      parameters:
        - name: lastName
          in: query
          description: Last name to search for (empty string returns all)
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (default is 1)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        '200':
          description: Search results page
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect to owner details (when exactly one owner found)
          headers:
            Location:
              schema:
                type: string
                example: /owners/1

  /owners/find:
    get:
      summary: Show find owners form
      description: Returns the form to search for owners
      operationId: showFindOwnersForm
      tags:
        - Owners
      responses:
        '200':
          description: Find owners form
          content:
            text/html:
              schema:
                type: string

  /owners/new:
    get:
      summary: Show create owner form
      description: Returns the form to create a new owner
      operationId: showCreateOwnerForm
      tags:
        - Owners
      responses:
        '200':
          description: Create owner form
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Create a new owner
      description: Creates a new owner with the provided information
      operationId: createOwner
      tags:
        - Owners
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerForm'
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '302':
          description: Redirect to owner details page
          headers:
            Location:
              schema:
                type: string
                example: /owners/1
        '200':
          description: Form with validation errors
          content:
            text/html:
              schema:
                type: string

  /owners/{ownerId}:
    get:
      summary: Get owner details
      description: Returns the details page for a specific owner
      operationId: getOwner
      tags:
        - Owners
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Owner details page
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner not found

  /owners/{ownerId}/edit:
    get:
      summary: Show edit owner form
      description: Returns the form to edit an existing owner
      operationId: showEditOwnerForm
      tags:
        - Owners
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Edit owner form
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner not found
    post:
      summary: Update an owner
      description: Updates an existing owner with the provided information
      operationId: updateOwner
      tags:
        - Owners
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerForm'
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '302':
          description: Redirect to owner details page
          headers:
            Location:
              schema:
                type: string
                example: /owners/1
        '200':
          description: Form with validation errors
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner not found

  /owners/{ownerId}/pets/new:
    get:
      summary: Show create pet form
      description: Returns the form to create a new pet for an owner
      operationId: showCreatePetForm
      tags:
        - Pets
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Create pet form
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner not found
    post:
      summary: Create a new pet
      description: Creates a new pet for an owner
      operationId: createPet
      tags:
        - Pets
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PetForm'
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '302':
          description: Redirect to owner details page
          headers:
            Location:
              schema:
                type: string
                example: /owners/1
        '200':
          description: Form with validation errors
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner not found

  /owners/{ownerId}/pets/{petId}/edit:
    get:
      summary: Show edit pet form
      description: Returns the form to edit an existing pet
      operationId: showEditPetForm
      tags:
        - Pets
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
        - name: petId
          in: path
          required: true
          description: Pet ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Edit pet form
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner or pet not found
    post:
      summary: Update a pet
      description: Updates an existing pet
      operationId: updatePet
      tags:
        - Pets
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
        - name: petId
          in: path
          required: true
          description: Pet ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PetForm'
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '302':
          description: Redirect to owner details page
          headers:
            Location:
              schema:
                type: string
                example: /owners/1
        '200':
          description: Form with validation errors
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner or pet not found

  /owners/{ownerId}/pets/{petId}/visits/new:
    get:
      summary: Show create visit form
      description: Returns the form to create a new visit for a pet
      operationId: showCreateVisitForm
      tags:
        - Visits
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
        - name: petId
          in: path
          required: true
          description: Pet ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Create visit form
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner or pet not found
    post:
      summary: Create a new visit
      description: Creates a new visit for a pet
      operationId: createVisit
      tags:
        - Visits
      parameters:
        - name: ownerId
          in: path
          required: true
          description: Owner ID
          schema:
            type: integer
            minimum: 1
        - name: petId
          in: path
          required: true
          description: Pet ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitForm'
          application/json:
            schema:
              $ref: '#/components/schemas/VisitInput'
      responses:
        '302':
          description: Redirect to owner details page
          headers:
            Location:
              schema:
                type: string
                example: /owners/1
        '200':
          description: Form with validation errors
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Owner or pet not found

components:
  schemas:
    BaseEntity:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier
          readOnly: true
      description: Base entity with ID

    NamedEntity:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          properties:
            name:
              type: string
              description: Name of the entity
      description: Named entity with ID and name

    Person:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required:
            - firstName
            - lastName
          properties:
            firstName:
              type: string
              description: First name
            lastName:
              type: string
              description: Last name
      description: Person entity with ID, first name, and last name

    Owner:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required:
            - address
            - city
            - telephone
          properties:
            address:
              type: string
              description: Street address
            city:
              type: string
              description: City
            telephone:
              type: string
              pattern: '^\d{1,10}$'
              description: Telephone number (up to 10 digits)
            pets:
              type: array
              items:
                $ref: '#/components/schemas/Pet'
              description: List of pets owned by this owner
              readOnly: true
      description: Owner entity representing a pet owner

    OwnerInput:
      type: object
      required:
        - firstName
        - lastName
        - address
        - city
        - telephone
      properties:
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        address:
          type: string
          description: Street address
        city:
          type: string
          description: City
        telephone:
          type: string
          pattern: '^\d{1,10}$'
          description: Telephone number (up to 10 digits)

    OwnerForm:
      type: object
      required:
        - firstName
        - lastName
        - address
        - city
        - telephone
      properties:
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        address:
          type: string
          description: Street address
        city:
          type: string
          description: City
        telephone:
          type: string
          pattern: '^\d{1,10}$'
          description: Telephone number (up to 10 digits)
        _method:
          type: string
          description: HTTP method override (for form submissions)

    Pet:
      allOf:
        - $ref: '#/components/schemas/NamedEntity'
        - type: object
          required:
            - name
            - birthDate
            - type
          properties:
            name:
              type: string
              description: Pet name
            birthDate:
              type: string
              format: date
              description: Date of birth (YYYY-MM-DD)
            type:
              $ref: '#/components/schemas/PetType'
              description: Type of pet
            visits:
              type: array
              items:
                $ref: '#/components/schemas/Visit'
              description: List of visits for this pet
              readOnly: true
      description: Pet entity

    PetInput:
      type: object
      required:
        - name
        - birthDate
        - type
      properties:
        name:
          type: string
          description: Pet name
        birthDate:
          type: string
          format: date
          description: Date of birth (YYYY-MM-DD)
        type:
          type: integer
          format: int32
          description: Pet type ID

    PetForm:
      type: object
      required:
        - name
        - birthDate
        - type
      properties:
        name:
          type: string
          description: Pet name
        birthDate:
          type: string
          format: date
          description: Date of birth (YYYY-MM-DD)
        type:
          type: integer
          format: int32
          description: Pet type ID

    PetType:
      $ref: '#/components/schemas/NamedEntity'
      description: Pet type (e.g., cat, dog, hamster)

    Visit:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required:
            - description
          properties:
            date:
              type: string
              format: date
              description: Visit date (YYYY-MM-DD). Defaults to current date if not provided.
            description:
              type: string
              description: Visit description
      description: Visit entity representing a veterinary visit

    VisitInput:
      type: object
      required:
        - description
      properties:
        date:
          type: string
          format: date
          description: Visit date (YYYY-MM-DD). Defaults to current date if not provided.
        description:
          type: string
          description: Visit description

    VisitForm:
      type: object
      required:
        - description
      properties:
        date:
          type: string
          format: date
          description: Visit date (YYYY-MM-DD). Defaults to current date if not provided.
        description:
          type: string
          description: Visit description

    Vet:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            specialties:
              type: array
              items:
                $ref: '#/components/schemas/Specialty'
              description: List of specialties
              readOnly: true
      description: Veterinarian entity

    Specialty:
      $ref: '#/components/schemas/NamedEntity'
      description: Veterinary specialty (e.g., dentistry, radiology)

    Vets:
      type: object
      properties:
        vetList:
          type: array
          items:
            $ref: '#/components/schemas/Vet'
          description: List of veterinarians
      description: Container for a list of veterinarians

tags:
  - name: System
    description: System endpoints
  - name: Owners
    description: Owner management endpoints
  - name: Pets
    description: Pet management endpoints
  - name: Visits
    description: Visit management endpoints
  - name: Veterinarians
    description: Veterinarian information endpoints

