openapi: 3.0.3
info:
  title: Media Microservices API
  description: |
    REST API documentation for the Media Microservices application.
    This microservices-based system provides functionality for managing users, movies, reviews, cast information, and plots.
    
    The API is exposed through an Nginx web server that acts as a gateway to various backend microservices.
  version: 1.0.0
  contact:
    name: Media Microservices Team
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://nginx-thrift:8080
    description: Docker container server

tags:
  - name: User
    description: User management operations
  - name: Movie
    description: Movie registration and management
  - name: Review
    description: Review composition and management
  - name: MovieInfo
    description: Movie information management
  - name: CastInfo
    description: Cast information management
  - name: Plot
    description: Plot information management

paths:
  /wrk2-api/user/register:
    post:
      tags:
        - User
      summary: Register a new user
      description: |
        Registers a new user in the system. Requires first name, last name, username, and password.
        The service will create a new user account and store it in the database.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - username
                - password
              properties:
                first_name:
                  type: string
                  description: User's first name
                  example: John
                last_name:
                  type: string
                  description: User's last name
                  example: Doe
                username:
                  type: string
                  description: Unique username for the user
                  example: johndoe
                password:
                  type: string
                  format: password
                  description: User's password
                  example: securepassword123
      responses:
        '200':
          description: User successfully registered
          content:
            text/plain:
              schema:
                type: string
                example: "User registered successfully"
        '400':
          description: Bad request - Incomplete arguments
          content:
            text/plain:
              schema:
                type: string
                example: "Incomplete arguments"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Internal server error"

  /wrk2-api/movie/register:
    post:
      tags:
        - Movie
      summary: Register a new movie
      description: |
        Registers a new movie in the system. Associates a movie ID with a movie title.
        This is used to register movies that can later be reviewed and have detailed information added.
      operationId: registerMovie
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - title
                - movie_id
              properties:
                title:
                  type: string
                  description: Movie title
                  example: "The Matrix"
                movie_id:
                  type: string
                  description: Unique identifier for the movie
                  example: "tt0133093"
      responses:
        '200':
          description: Movie successfully registered
          content:
            text/plain:
              schema:
                type: string
                example: "Movie registered successfully"
        '400':
          description: Bad request - Incomplete arguments
          content:
            text/plain:
              schema:
                type: string
                example: "Incomplete arguments"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Internal server error"

  /wrk2-api/review/compose:
    post:
      tags:
        - Review
      summary: Compose a review
      description: |
        Composes a review for a movie. This endpoint orchestrates multiple microservices:
        - Uploads user information
        - Uploads movie ID
        - Uploads review text
        - Generates a unique ID for the review
        
        All operations are performed in parallel for better performance.
      operationId: composeReview
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
                - title
                - rating
                - text
              properties:
                username:
                  type: string
                  description: Username of the reviewer
                  example: "johndoe"
                password:
                  type: string
                  format: password
                  description: Password of the reviewer
                  example: "securepassword123"
                title:
                  type: string
                  description: Title of the movie being reviewed
                  example: "The Matrix"
                rating:
                  type: integer
                  minimum: 0
                  maximum: 10
                  description: Rating given to the movie (0-10)
                  example: 8
                text:
                  type: string
                  description: Review text content
                  example: "A groundbreaking science fiction film that redefined the genre."
      responses:
        '200':
          description: Review successfully composed
          content:
            text/plain:
              schema:
                type: string
                example: "Review composed successfully"
        '400':
          description: Bad request - Incomplete arguments
          content:
            text/plain:
              schema:
                type: string
                example: "Incomplete arguments"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Internal server error"

  /wrk2-api/movie-info/write:
    post:
      tags:
        - MovieInfo
      summary: Write movie information
      description: |
        Writes comprehensive movie information including title, cast, plot ID, media IDs, and ratings.
        This endpoint accepts JSON data with complete movie details.
      operationId: writeMovieInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - movie_id
                - title
                - casts
                - plot_id
                - thumbnail_ids
                - photo_ids
                - video_ids
                - avg_rating
                - num_rating
              properties:
                movie_id:
                  type: string
                  description: Unique identifier for the movie
                  example: "tt0133093"
                title:
                  type: string
                  description: Movie title
                  example: "The Matrix"
                casts:
                  type: array
                  description: List of cast members
                  items:
                    type: object
                    required:
                      - cast_id
                      - character
                      - cast_info_id
                    properties:
                      cast_id:
                        type: integer
                        description: Cast ID
                        example: 1
                      character:
                        type: string
                        description: Character name
                        example: "Neo"
                      cast_info_id:
                        type: integer
                        format: int64
                        description: Reference to cast information
                        example: 1001
                plot_id:
                  type: integer
                  format: int64
                  description: Reference to plot information
                  example: 2001
                thumbnail_ids:
                  type: array
                  description: List of thumbnail image IDs
                  items:
                    type: string
                  example: ["thumb1", "thumb2"]
                photo_ids:
                  type: array
                  description: List of photo IDs
                  items:
                    type: string
                  example: ["photo1", "photo2"]
                video_ids:
                  type: array
                  description: List of video IDs
                  items:
                    type: string
                  example: ["video1", "video2"]
                avg_rating:
                  type: number
                  format: double
                  description: Average rating of the movie
                  example: 8.7
                num_rating:
                  type: integer
                  description: Number of ratings received
                  example: 1500
            example:
              movie_id: "tt0133093"
              title: "The Matrix"
              casts:
                - cast_id: 1
                  character: "Neo"
                  cast_info_id: 1001
                - cast_id: 2
                  character: "Morpheus"
                  cast_info_id: 1002
              plot_id: 2001
              thumbnail_ids: ["thumb1", "thumb2"]
              photo_ids: ["photo1", "photo2"]
              video_ids: ["video1", "video2"]
              avg_rating: 8.7
              num_rating: 1500
      responses:
        '200':
          description: Movie information successfully written
          content:
            text/plain:
              schema:
                type: string
                example: "8.7"
        '400':
          description: Bad request - Empty body or incomplete arguments
          content:
            text/plain:
              schema:
                type: string
                example: "Incomplete arguments"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Internal server error"

  /wrk2-api/cast-info/write:
    post:
      tags:
        - CastInfo
      summary: Write cast information
      description: |
        Writes cast member information including name, gender, and introduction.
        This information is used to populate cast details in movie information.
      operationId: writeCastInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cast_info_id
                - name
                - gender
                - intro
              properties:
                cast_info_id:
                  type: integer
                  format: int64
                  description: Unique identifier for the cast information
                  example: 1001
                name:
                  type: string
                  description: Cast member's name
                  example: "Keanu Reeves"
                gender:
                  type: boolean
                  description: Gender of the cast member (true for male, false for female)
                  example: true
                intro:
                  type: string
                  description: Introduction or biography of the cast member
                  example: "Keanu Reeves is a Canadian actor known for his roles in action and science fiction films."
            example:
              cast_info_id: 1001
              name: "Keanu Reeves"
              gender: true
              intro: "Keanu Reeves is a Canadian actor known for his roles in action and science fiction films."
      responses:
        '200':
          description: Cast information successfully written
          content:
            text/plain:
              schema:
                type: string
                example: "Cast information written successfully"
        '400':
          description: Bad request - Empty body or incomplete arguments
          content:
            text/plain:
              schema:
                type: string
                example: "Incomplete arguments"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Internal server error"

  /wrk2-api/plot/write:
    post:
      tags:
        - Plot
      summary: Write plot information
      description: |
        Writes plot information for a movie. The plot is a textual description of the movie's storyline.
        This information is referenced by movie information through plot_id.
      operationId: writePlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plot_id
                - plot
              properties:
                plot_id:
                  type: integer
                  format: int64
                  description: Unique identifier for the plot
                  example: 2001
                plot:
                  type: string
                  description: Plot description text
                  example: "A computer hacker learns from mysterious rebels about the true nature of his reality and his role in the war against its controllers."
            example:
              plot_id: 2001
              plot: "A computer hacker learns from mysterious rebels about the true nature of his reality and his role in the war against its controllers."
      responses:
        '200':
          description: Plot information successfully written
          content:
            text/plain:
              schema:
                type: string
                example: "Plot information written successfully"
        '400':
          description: Bad request - Empty body or incomplete arguments
          content:
            text/plain:
              schema:
                type: string
                example: "Incomplete arguments"
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: "Internal server error"

components:
  schemas:
    User:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: Unique user identifier
        first_name:
          type: string
          description: User's first name
        last_name:
          type: string
          description: User's last name
        username:
          type: string
          description: Unique username
        password:
          type: string
          format: password
          description: User's password (hashed)
        salt:
          type: string
          description: Salt used for password hashing

    Review:
      type: object
      properties:
        review_id:
          type: integer
          format: int64
          description: Unique review identifier
        user_id:
          type: integer
          format: int64
          description: ID of the user who wrote the review
        req_id:
          type: integer
          format: int64
          description: Request ID for tracing
        text:
          type: string
          description: Review text content
        movie_id:
          type: string
          description: ID of the movie being reviewed
        rating:
          type: integer
          minimum: 0
          maximum: 10
          description: Rating given (0-10)
        timestamp:
          type: integer
          format: int64
          description: Timestamp when the review was created

    CastInfo:
      type: object
      properties:
        cast_info_id:
          type: integer
          format: int64
          description: Unique cast information identifier
        name:
          type: string
          description: Cast member's name
        gender:
          type: boolean
          description: Gender (true for male, false for female)
        intro:
          type: string
          description: Introduction or biography

    Cast:
      type: object
      properties:
        cast_id:
          type: integer
          description: Cast ID
        character:
          type: string
          description: Character name
        cast_info_id:
          type: integer
          format: int64
          description: Reference to cast information

    MovieInfo:
      type: object
      properties:
        movie_id:
          type: string
          description: Unique movie identifier
        title:
          type: string
          description: Movie title
        casts:
          type: array
          items:
            $ref: '#/components/schemas/Cast'
          description: List of cast members
        plot_id:
          type: integer
          format: int64
          description: Reference to plot information
        thumbnail_ids:
          type: array
          items:
            type: string
          description: List of thumbnail image IDs
        photo_ids:
          type: array
          items:
            type: string
          description: List of photo IDs
        video_ids:
          type: array
          items:
            type: string
          description: List of video IDs
        avg_rating:
          type: number
          format: double
          description: Average rating
        num_rating:
          type: integer
          description: Number of ratings received

    Page:
      type: object
      properties:
        movie_info:
          $ref: '#/components/schemas/MovieInfo'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
          description: List of reviews
        cast_infos:
          type: array
          items:
            $ref: '#/components/schemas/CastInfo'
          description: List of cast information
        plot:
          type: string
          description: Plot description

    ServiceException:
      type: object
      properties:
        errorCode:
          type: string
          enum:
            - SE_THRIFT_CONNPOOL_TIMEOUT
            - SE_THRIFT_CONN_ERROR
            - SE_UNAUTHORIZED
            - SE_MEMCACHED_ERROR
            - SE_MONGODB_ERROR
            - SE_REDIS_ERROR
            - SE_THRIFT_HANDLER_ERROR
          description: Error code
        message:
          type: string
          description: Error message

