version: '3.8'

services:
  petclinic:
    image: aape2k/petclinic-native:latest
    ports:
      - "8006:8006"
    environment:
      - MICRONAUT_SERVER_PORT=8006
      - HARNESS_JAVA_OPTS=-XX:+FlightRecorder -XX:StartFlightRecording=filename=/app/logs/recording.jfr,maxsize=100M,maxage=1d,disk=true
    restart: unless-stopped
    networks:
      - petclinic-network
networks:
  petclinic-network:
    driver: bridge

