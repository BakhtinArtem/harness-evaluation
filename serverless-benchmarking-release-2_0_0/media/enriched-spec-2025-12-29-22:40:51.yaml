components:
    schemas:
        Cast:
            properties:
                cast_id:
                    description: Cast ID
                    type: integer
                    x-user-hint: uuid
                cast_info_id:
                    description: Reference to cast information
                    format: int64
                    type: integer
                    x-user-hint: uuid
                character:
                    description: Character name
                    type: string
                    x-user-hint: string
            type: object
        CastInfo:
            properties:
                cast_info_id:
                    description: Unique cast information identifier
                    format: int64
                    type: integer
                    x-user-hint: uuid
                gender:
                    description: Gender (true for male, false for female)
                    type: boolean
                    x-user-hint: string
                intro:
                    description: Introduction or biography
                    type: string
                    x-user-hint: string
                name:
                    description: Cast member's name
                    type: string
                    x-user-hint: name
            type: object
        MovieInfo:
            properties:
                avg_rating:
                    description: Average rating
                    format: double
                    type: number
                    x-user-hint: int
                casts:
                    description: List of cast members
                    items:
                        $ref: '#/components/schemas/Cast'
                    type: array
                movie_id:
                    description: Unique movie identifier
                    type: string
                    x-user-hint: uuid
                num_rating:
                    description: Number of ratings received
                    type: integer
                    x-user-hint: int
                photo_ids:
                    description: List of photo IDs
                    items:
                        type: string
                        x-user-hint: uuid
                    type: array
                plot_id:
                    description: Reference to plot information
                    format: int64
                    type: integer
                    x-user-hint: uuid
                thumbnail_ids:
                    description: List of thumbnail image IDs
                    items:
                        type: string
                        x-user-hint: uuid
                    type: array
                title:
                    description: Movie title
                    type: string
                    x-user-hint: string
                video_ids:
                    description: List of video IDs
                    items:
                        type: string
                        x-user-hint: uuid
                    type: array
            type: object
        Page:
            properties:
                cast_infos:
                    description: List of cast information
                    items:
                        $ref: '#/components/schemas/CastInfo'
                    type: array
                movie_info:
                    $ref: '#/components/schemas/MovieInfo'
                plot:
                    description: Plot description
                    type: string
                    x-user-hint: string
                reviews:
                    description: List of reviews
                    items:
                        $ref: '#/components/schemas/Review'
                    type: array
            type: object
        Review:
            properties:
                movie_id:
                    description: ID of the movie being reviewed
                    type: string
                    x-user-hint: uuid
                rating:
                    description: Rating given (0-10)
                    maximum: 10
                    minimum: 0
                    type: integer
                    x-user-hint: int
                req_id:
                    description: Request ID for tracing
                    format: int64
                    type: integer
                    x-user-hint: uuid
                review_id:
                    description: Unique review identifier
                    format: int64
                    type: integer
                    x-user-hint: uuid
                text:
                    description: Review text content
                    type: string
                    x-user-hint: string
                timestamp:
                    description: Timestamp when the review was created
                    format: int64
                    type: integer
                    x-user-hint: timestamp
                user_id:
                    description: ID of the user who wrote the review
                    format: int64
                    type: integer
                    x-user-hint: uuid
            type: object
        ServiceException:
            properties:
                errorCode:
                    description: Error code
                    enum:
                        - SE_THRIFT_CONNPOOL_TIMEOUT
                        - SE_THRIFT_CONN_ERROR
                        - SE_UNAUTHORIZED
                        - SE_MEMCACHED_ERROR
                        - SE_MONGODB_ERROR
                        - SE_REDIS_ERROR
                        - SE_THRIFT_HANDLER_ERROR
                    type: string
                    x-user-hint: int
                message:
                    description: Error message
                    type: string
                    x-user-hint: string
            type: object
        User:
            properties:
                first_name:
                    description: User's first name
                    type: string
                    x-user-hint: name
                last_name:
                    description: User's last name
                    type: string
                    x-user-hint: surname
                password:
                    description: User's password (hashed)
                    format: password
                    type: string
                    x-user-hint: int
                salt:
                    description: Salt used for password hashing
                    type: string
                    x-user-hint: string
                user_id:
                    description: Unique user identifier
                    format: int64
                    type: integer
                    x-user-hint: uuid
                username:
                    description: Unique username
                    type: string
                    x-user-hint: name
            type: object
info:
    contact:
        name: Media Microservices Team
    description: |
        REST API documentation for the Media Microservices application.
        This microservices-based system provides functionality for managing users, movies, reviews, cast information, and plots.

        The API is exposed through an Nginx web server that acts as a gateway to various backend microservices.
    license:
        name: MIT
    title: Media Microservices API
    version: 1.0.0
openapi: 3.0.3
paths:
    /wrk2-api/cast-info/write:
        post:
            description: |
                Writes cast member information including name, gender, and introduction.
                This information is used to populate cast details in movie information.
            operationId: writeCastInfo
            requestBody:
                content:
                    application/json:
                        example:
                            cast_info_id: 1001
                            gender: true
                            intro: Keanu Reeves is a Canadian actor known for his roles in action and science fiction films.
                            name: Keanu Reeves
                        schema:
                            properties:
                                cast_info_id:
                                    description: Unique identifier for the cast information
                                    example: 1001
                                    format: int64
                                    type: integer
                                    x-user-hint: uuid
                                gender:
                                    description: Gender of the cast member (true for male, false for female)
                                    example: true
                                    type: boolean
                                    x-user-hint: string
                                intro:
                                    description: Introduction or biography of the cast member
                                    example: Keanu Reeves is a Canadian actor known for his roles in action and science fiction films.
                                    type: string
                                    x-user-hint: string
                                name:
                                    description: Cast member's name
                                    example: Keanu Reeves
                                    type: string
                                    x-user-hint: name
                            required:
                                - cast_info_id
                                - name
                                - gender
                                - intro
                            type: object
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                example: Cast information written successfully
                                type: string
                    description: Cast information successfully written
                "400":
                    content:
                        text/plain:
                            schema:
                                example: Incomplete arguments
                                type: string
                    description: Bad request - Empty body or incomplete arguments
                "500":
                    content:
                        text/plain:
                            schema:
                                example: Internal server error
                                type: string
                    description: Internal server error
            summary: Write cast information
            tags:
                - CastInfo
    /wrk2-api/movie-info/write:
        post:
            description: |
                Writes comprehensive movie information including title, cast, plot ID, media IDs, and ratings.
                This endpoint accepts JSON data with complete movie details.
            operationId: writeMovieInfo
            requestBody:
                content:
                    application/json:
                        example:
                            avg_rating: 8.7
                            casts:
                                - cast_id: 1
                                  cast_info_id: 1001
                                  character: Neo
                                - cast_id: 2
                                  cast_info_id: 1002
                                  character: Morpheus
                            movie_id: tt0133093
                            num_rating: 1500
                            photo_ids:
                                - photo1
                                - photo2
                            plot_id: 2001
                            thumbnail_ids:
                                - thumb1
                                - thumb2
                            title: The Matrix
                            video_ids:
                                - video1
                                - video2
                        schema:
                            properties:
                                avg_rating:
                                    description: Average rating of the movie
                                    example: 8.7
                                    format: double
                                    type: number
                                    x-user-hint: int
                                casts:
                                    description: List of cast members
                                    items:
                                        properties:
                                            cast_id:
                                                description: Cast ID
                                                example: 1
                                                type: integer
                                                x-user-hint: uuid
                                            cast_info_id:
                                                description: Reference to cast information
                                                example: 1001
                                                format: int64
                                                type: integer
                                                x-user-hint: uuid
                                            character:
                                                description: Character name
                                                example: Neo
                                                type: string
                                                x-user-hint: string
                                        required:
                                            - cast_id
                                            - character
                                            - cast_info_id
                                        type: object
                                    type: array
                                movie_id:
                                    description: Unique identifier for the movie
                                    example: tt0133093
                                    type: string
                                    x-user-hint: uuid
                                num_rating:
                                    description: Number of ratings received
                                    example: 1500
                                    type: integer
                                    x-user-hint: int
                                photo_ids:
                                    description: List of photo IDs
                                    example:
                                        - photo1
                                        - photo2
                                    items:
                                        type: string
                                        x-user-hint: uuid
                                    type: array
                                plot_id:
                                    description: Reference to plot information
                                    example: 2001
                                    format: int64
                                    type: integer
                                    x-user-hint: uuid
                                thumbnail_ids:
                                    description: List of thumbnail image IDs
                                    example:
                                        - thumb1
                                        - thumb2
                                    items:
                                        type: string
                                        x-user-hint: uuid
                                    type: array
                                title:
                                    description: Movie title
                                    example: The Matrix
                                    type: string
                                    x-user-hint: string
                                video_ids:
                                    description: List of video IDs
                                    example:
                                        - video1
                                        - video2
                                    items:
                                        type: string
                                        x-user-hint: uuid
                                    type: array
                            required:
                                - movie_id
                                - title
                                - casts
                                - plot_id
                                - thumbnail_ids
                                - photo_ids
                                - video_ids
                                - avg_rating
                                - num_rating
                            type: object
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                example: "8.7"
                                type: string
                    description: Movie information successfully written
                "400":
                    content:
                        text/plain:
                            schema:
                                example: Incomplete arguments
                                type: string
                    description: Bad request - Empty body or incomplete arguments
                "500":
                    content:
                        text/plain:
                            schema:
                                example: Internal server error
                                type: string
                    description: Internal server error
            summary: Write movie information
            tags:
                - MovieInfo
    /wrk2-api/movie/register:
        post:
            description: |
                Registers a new movie in the system. Associates a movie ID with a movie title.
                This is used to register movies that can later be reviewed and have detailed information added.
            operationId: registerMovie
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            properties:
                                movie_id:
                                    description: Unique identifier for the movie
                                    example: tt0133093
                                    type: string
                                    x-user-hint: uuid
                                title:
                                    description: Movie title
                                    example: The Matrix
                                    type: string
                                    x-user-hint: string
                            required:
                                - title
                                - movie_id
                            type: object
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                example: Movie registered successfully
                                type: string
                    description: Movie successfully registered
                "400":
                    content:
                        text/plain:
                            schema:
                                example: Incomplete arguments
                                type: string
                    description: Bad request - Incomplete arguments
                "500":
                    content:
                        text/plain:
                            schema:
                                example: Internal server error
                                type: string
                    description: Internal server error
            summary: Register a new movie
            tags:
                - Movie
    /wrk2-api/plot/write:
        post:
            description: |
                Writes plot information for a movie. The plot is a textual description of the movie's storyline.
                This information is referenced by movie information through plot_id.
            operationId: writePlot
            requestBody:
                content:
                    application/json:
                        example:
                            plot: A computer hacker learns from mysterious rebels about the true nature of his reality and his role in the war against its controllers.
                            plot_id: 2001
                        schema:
                            properties:
                                plot:
                                    description: Plot description text
                                    example: A computer hacker learns from mysterious rebels about the true nature of his reality and his role in the war against its controllers.
                                    type: string
                                    x-user-hint: string
                                plot_id:
                                    description: Unique identifier for the plot
                                    example: 2001
                                    format: int64
                                    type: integer
                                    x-user-hint: uuid
                            required:
                                - plot_id
                                - plot
                            type: object
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                example: Plot information written successfully
                                type: string
                    description: Plot information successfully written
                "400":
                    content:
                        text/plain:
                            schema:
                                example: Incomplete arguments
                                type: string
                    description: Bad request - Empty body or incomplete arguments
                "500":
                    content:
                        text/plain:
                            schema:
                                example: Internal server error
                                type: string
                    description: Internal server error
            summary: Write plot information
            tags:
                - Plot
    /wrk2-api/review/compose:
        post:
            description: |
                Composes a review for a movie. This endpoint orchestrates multiple microservices:
                - Uploads user information
                - Uploads movie ID
                - Uploads review text
                - Generates a unique ID for the review

                All operations are performed in parallel for better performance.
            operationId: composeReview
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            properties:
                                password:
                                    description: Password of the reviewer
                                    example: securepassword123
                                    format: password
                                    type: string
                                    x-user-hint: int
                                rating:
                                    description: Rating given to the movie (0-10)
                                    example: 8
                                    maximum: 10
                                    minimum: 0
                                    type: integer
                                    x-user-hint: int
                                text:
                                    description: Review text content
                                    example: A groundbreaking science fiction film that redefined the genre.
                                    type: string
                                    x-user-hint: string
                                title:
                                    description: Title of the movie being reviewed
                                    example: The Matrix
                                    type: string
                                    x-user-hint: string
                                username:
                                    description: Username of the reviewer
                                    example: johndoe
                                    type: string
                                    x-user-hint: name
                            required:
                                - username
                                - password
                                - title
                                - rating
                                - text
                            type: object
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                example: Review composed successfully
                                type: string
                    description: Review successfully composed
                "400":
                    content:
                        text/plain:
                            schema:
                                example: Incomplete arguments
                                type: string
                    description: Bad request - Incomplete arguments
                "500":
                    content:
                        text/plain:
                            schema:
                                example: Internal server error
                                type: string
                    description: Internal server error
            summary: Compose a review
            tags:
                - Review
    /wrk2-api/user/register:
        post:
            description: |
                Registers a new user in the system. Requires first name, last name, username, and password.
                The service will create a new user account and store it in the database.
            operationId: registerUser
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            properties:
                                first_name:
                                    description: User's first name
                                    example: John
                                    type: string
                                    x-user-hint: name
                                last_name:
                                    description: User's last name
                                    example: Doe
                                    type: string
                                    x-user-hint: surname
                                password:
                                    description: User's password
                                    example: securepassword123
                                    format: password
                                    type: string
                                    x-user-hint: int
                                username:
                                    description: Unique username for the user
                                    example: johndoe
                                    type: string
                                    x-user-hint: name
                            required:
                                - first_name
                                - last_name
                                - username
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                example: User registered successfully
                                type: string
                    description: User successfully registered
                "400":
                    content:
                        text/plain:
                            schema:
                                example: Incomplete arguments
                                type: string
                    description: Bad request - Incomplete arguments
                "500":
                    content:
                        text/plain:
                            schema:
                                example: Internal server error
                                type: string
                    description: Internal server error
            summary: Register a new user
            tags:
                - User
servers:
    - description: Local development server
      url: http://localhost:8080
    - description: Docker container server
      url: http://nginx-thrift:8080
tags:
    - description: User management operations
      name: User
    - description: Movie registration and management
      name: Movie
    - description: Review composition and management
      name: Review
    - description: Movie information management
      name: MovieInfo
    - description: Cast information management
      name: CastInfo
    - description: Plot information management
      name: Plot
