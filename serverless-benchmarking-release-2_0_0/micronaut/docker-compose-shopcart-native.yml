version: '3.8'

services:
  shopcart:
    image: aape2k/shopcart-native:latest
    ports:
      - "8001:8001"
    environment:
      - MICRONAUT_SERVER_PORT=8001
      - HARNESS_JAVA_OPTS=-XX:+FlightRecorder -XX:StartFlightRecording=filename=/app/logs/recording.jfr,maxsize=100M,maxage=1d,disk=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/memory"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - shopcart-network
networks:
  shopcart-network:
    driver: bridge

