openapi: 3.0.3
info:
  title: Micronaut ShopCart API
  description: |
    API for managing clients and shopping cart operations in a Micronaut web application.
    This API allows you to create clients, manage their shopping carts, and add/remove products.
  version: 0.3.10
  contact:
    name: ShopCart API Support

servers:
  - url: http://localhost:8001
    description: Local development server
  - url: http://localhost:8001
    description: Production server

paths:
  /:
    post:
      summary: Create a new client
      description: |
        Creates a new client with an optional username. If username is not provided, 
        it will be auto-generated in the format "client{N}" where N is an incrementing number.
      operationId: addClient
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSaveCommand'
            example:
              username: "1234"
              name: "John Barista"
      responses:
        '200':
          description: Client created successfully
          content:
            text/plain:
              schema:
                type: string
              example: "Client = { username = 1234, name = John Barista, cart = ShoppingCart = { nextProductId = 0, numberProducts = 0 } }"
        '400':
          description: Invalid request data
          content:
            text/plain:
              schema:
                type: string
              example: "Error, unable to create client: ClientSaveCommand = { username = null, name = null }"

  /{cid}:
    get:
      summary: Get client by ID
      description: Retrieves client information by client ID
      operationId: getClient
      tags:
        - Clients
      parameters:
        - name: cid
          in: path
          required: true
          description: Client ID
          schema:
            type: string
          example: "1234"
      responses:
        '200':
          description: Client found
          content:
            text/plain:
              schema:
                type: string
              example: "Client = { username = 1234, name = John Barista, cart = ShoppingCart = { nextProductId = 1, numberProducts = 1 } }"
        '404':
          description: Client not found
          content:
            text/plain:
              schema:
                type: string
              example: "Error, no such client: 1234"

    delete:
      summary: Delete client
      description: |
        Removes a client and all associated products from the cart. 
        This operation is irreversible.
      operationId: removeClient
      tags:
        - Clients
      parameters:
        - name: cid
          in: path
          required: true
          description: Client ID
          schema:
            type: string
          example: "1234"
      responses:
        '200':
          description: Client deleted successfully
          content:
            text/plain:
              schema:
                type: string
              example: "1234"

  /cart:
    post:
      summary: Add product to cart
      description: |
        Adds a product to the shopping cart of a specific client. 
        The product will be assigned a unique ID based on the client's username and product index.
      operationId: addProduct
      tags:
        - Shopping Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSaveCommand'
            example:
              username: "1234"
              name: "coffee"
              amount: 10
      responses:
        '200':
          description: Product added successfully
          content:
            text/plain:
              schema:
                type: string
              example: "Product = { id = 1234$0, name = coffee, quantity = 10, timestamp = 1760449181607, price = Price = { currency = EUR, amount = 1.000000 } }"
        '400':
          description: Invalid request data or client not found
          content:
            text/plain:
              schema:
                type: string
              example: "Error, no such client: ProductSaveCommand = { username = 1234, name = coffee, amount = 10 }"

    delete:
      summary: Remove product from cart
      description: Removes a specific product from a client's shopping cart
      operationId: removeProduct
      tags:
        - Shopping Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDeleteCommand'
            example:
              id: "1234$0"
              username: "1234"
      responses:
        '200':
          description: Product removed successfully
          content:
            text/plain:
              schema:
                type: string
              example: "1234$0"
        '400':
          description: Invalid request data, client not found, or product not found
          content:
            text/plain:
              schema:
                type: string
              example: "Error, unable to find product: ProductDeleteCommand = { id = 1234$0, username = 1234 }"

  /cart/{cid}:
    get:
      summary: Get cart products
      description: Retrieves all products in a client's shopping cart
      operationId: getProducts
      tags:
        - Shopping Cart
      parameters:
        - name: cid
          in: path
          required: true
          description: Client ID
          schema:
            type: string
          example: "1234"
      responses:
        '200':
          description: Cart products retrieved successfully
          content:
            text/plain:
              schema:
                type: string
              example: "[Product = { id = 1234$0, name = coffee, quantity = 10, timestamp = 1760449181607, price = Price = { currency = EUR, amount = 1.000000 } }]"
        '404':
          description: Client not found
          content:
            text/plain:
              schema:
                type: string
              example: "Error, no such client: 1234"

  /memory:
    get:
      summary: Get memory usage
      description: Returns the current memory usage of the application in KB
      operationId: getMemory
      tags:
        - System
      responses:
        '200':
          description: Memory usage retrieved successfully
          content:
            application/json:
              schema:
                type: integer
                format: int64
                description: Memory usage in KB
              example: 10240

components:
  schemas:
    ClientSaveCommand:
      type: object
      description: Command to create a new client
      properties:
        username:
          type: string
          description: Optional username. If not provided, will be auto-generated.
          example: "1234"
        name:
          type: string
          description: Client's full name (required)
          example: "John Barista"
      required:
        - name

    ProductSaveCommand:
      type: object
      description: Command to add a product to a shopping cart
      properties:
        username:
          type: string
          description: Client username (required)
          example: "1234"
        name:
          type: string
          description: Product name (required)
          example: "coffee"
        amount:
          type: integer
          description: Product quantity (required)
          example: 10
      required:
        - username
        - name
        - amount

    ProductDeleteCommand:
      type: object
      description: Command to remove a product from a shopping cart
      properties:
        id:
          type: string
          description: Product ID (required)
          example: "1234$0"
        username:
          type: string
          description: Client username (required)
          example: "1234"
      required:
        - id
        - username

    Client:
      type: object
      description: Client information
      properties:
        username:
          type: string
          example: "1234"
        name:
          type: string
          example: "John Barista"
        cart:
          $ref: '#/components/schemas/ShoppingCart'

    ShoppingCart:
      type: object
      description: Shopping cart information
      properties:
        nextProductId:
          type: integer
          description: Next product ID to be assigned
          example: 1
        numberProducts:
          type: integer
          description: Current number of products in the cart
          example: 1

    Product:
      type: object
      description: Product information
      properties:
        id:
          type: string
          example: "1234$0"
        name:
          type: string
          example: "coffee"
        quantity:
          type: integer
          example: 10
        timestamp:
          type: integer
          format: int64
          example: 1760449181607
        price:
          $ref: '#/components/schemas/Price'

    Price:
      type: object
      description: Price information
      properties:
        currency:
          type: string
          example: "EUR"
        amount:
          type: number
          format: float
          example: 1.0

tags:
  - name: Clients
    description: Operations for managing clients
  - name: Shopping Cart
    description: Operations for managing shopping cart and products
  - name: System
    description: System information endpoints
