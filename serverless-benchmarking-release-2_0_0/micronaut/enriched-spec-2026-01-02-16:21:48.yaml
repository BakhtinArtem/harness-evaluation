components:
    schemas:
        Client:
            description: Client information
            properties:
                cart:
                    $ref: '#/components/schemas/ShoppingCart'
                name:
                    example: John Barista
                    type: string
                    x-user-hint: firstName
                username:
                    example: "1234"
                    type: string
                    x-user-hint: username
            type: object
        ClientSaveCommand:
            description: Command to create a new client
            properties:
                name:
                    description: Client's full name (required)
                    example: John Barista
                    type: string
                    x-user-hint: firstName
                username:
                    description: Optional username. If not provided, will be auto-generated.
                    example: "1234"
                    type: string
                    x-user-hint: username
            required:
                - name
            type: object
        Price:
            description: Price information
            properties:
                amount:
                    example: 1
                    format: float
                    type: number
                    x-user-hint: number
                currency:
                    example: EUR
                    type: string
                    x-user-hint: string
            type: object
        Product:
            description: Product information
            properties:
                id:
                    example: 1234$0
                    type: string
                    x-user-hint: id
                name:
                    example: coffee
                    type: string
                    x-user-hint: firstName
                price:
                    $ref: '#/components/schemas/Price'
                quantity:
                    example: 10
                    type: integer
                    x-user-hint: number
                timestamp:
                    example: 1.760449181607e+12
                    format: int64
                    type: integer
                    x-user-hint: timestamp
            type: object
        ProductDeleteCommand:
            description: Command to remove a product from a shopping cart
            properties:
                id:
                    description: Product ID (required)
                    example: 1234$0
                    type: string
                    x-user-hint: id
                username:
                    description: Client username (required)
                    example: "1234"
                    type: string
                    x-user-hint: username
            required:
                - id
                - username
            type: object
        ProductSaveCommand:
            description: Command to add a product to a shopping cart
            properties:
                amount:
                    description: Product quantity (required)
                    example: 10
                    type: integer
                    x-user-hint: number
                name:
                    description: Product name (required)
                    example: coffee
                    type: string
                    x-user-hint: firstName
                username:
                    description: Client username (required)
                    example: "1234"
                    type: string
                    x-user-hint: username
            required:
                - username
                - name
                - amount
            type: object
        ShoppingCart:
            description: Shopping cart information
            properties:
                nextProductId:
                    description: Next product ID to be assigned
                    example: 1
                    type: integer
                    x-user-hint: id
                numberProducts:
                    description: Current number of products in the cart
                    example: 1
                    type: integer
                    x-user-hint: number
            type: object
info:
    contact:
        name: ShopCart API Support
    description: |
        API for managing clients and shopping cart operations in a Micronaut web application.
        This API allows you to create clients, manage their shopping carts, and add/remove products.
    title: Micronaut ShopCart API
    version: 0.3.10
openapi: 3.0.3
paths:
    /:
        post:
            description: "Creates a new client with an optional username. If username is not provided, \nit will be auto-generated in the format \"client{N}\" where N is an incrementing number.\n"
            operationId: addClient
            requestBody:
                content:
                    application/json:
                        example:
                            name: John Barista
                            username: "1234"
                        schema:
                            $ref: '#/components/schemas/ClientSaveCommand'
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            example: Client = { username = 1234, name = John Barista, cart = ShoppingCart = { nextProductId = 0, numberProducts = 0 } }
                            schema:
                                type: string
                    description: Client created successfully
                "400":
                    content:
                        text/plain:
                            example: 'Error, unable to create client: ClientSaveCommand = { username = null, name = null }'
                            schema:
                                type: string
                    description: Invalid request data
            summary: Create a new client
            tags:
                - Clients
    /{cid}:
        delete:
            description: "Removes a client and all associated products from the cart. \nThis operation is irreversible.\n"
            operationId: removeClient
            parameters:
                - description: Client ID
                  example: "1234"
                  in: path
                  name: cid
                  required: true
                  schema:
                    type: string
                    x-user-hint: id
            responses:
                "200":
                    content:
                        text/plain:
                            example: "1234"
                            schema:
                                type: string
                    description: Client deleted successfully
            summary: Delete client
            tags:
                - Clients
        get:
            description: Retrieves client information by client ID
            operationId: getClient
            parameters:
                - description: Client ID
                  example: "1234"
                  in: path
                  name: cid
                  required: true
                  schema:
                    type: string
                    x-user-hint: id
            responses:
                "200":
                    content:
                        text/plain:
                            example: Client = { username = 1234, name = John Barista, cart = ShoppingCart = { nextProductId = 1, numberProducts = 1 } }
                            schema:
                                type: string
                    description: Client found
                "404":
                    content:
                        text/plain:
                            example: 'Error, no such client: 1234'
                            schema:
                                type: string
                    description: Client not found
            summary: Get client by ID
            tags:
                - Clients
    /cart:
        delete:
            description: Removes a specific product from a client's shopping cart
            operationId: removeProduct
            requestBody:
                content:
                    application/json:
                        example:
                            id: 1234$0
                            username: "1234"
                        schema:
                            $ref: '#/components/schemas/ProductDeleteCommand'
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            example: 1234$0
                            schema:
                                type: string
                    description: Product removed successfully
                "400":
                    content:
                        text/plain:
                            example: 'Error, unable to find product: ProductDeleteCommand = { id = 1234$0, username = 1234 }'
                            schema:
                                type: string
                    description: Invalid request data, client not found, or product not found
            summary: Remove product from cart
            tags:
                - Shopping Cart
        post:
            description: "Adds a product to the shopping cart of a specific client. \nThe product will be assigned a unique ID based on the client's username and product index.\n"
            operationId: addProduct
            requestBody:
                content:
                    application/json:
                        example:
                            amount: 10
                            name: coffee
                            username: "1234"
                        schema:
                            $ref: '#/components/schemas/ProductSaveCommand'
                required: true
            responses:
                "200":
                    content:
                        text/plain:
                            example: Product = { id = 1234$0, name = coffee, quantity = 10, timestamp = 1760449181607, price = Price = { currency = EUR, amount = 1.000000 } }
                            schema:
                                type: string
                    description: Product added successfully
                "400":
                    content:
                        text/plain:
                            example: 'Error, no such client: ProductSaveCommand = { username = 1234, name = coffee, amount = 10 }'
                            schema:
                                type: string
                    description: Invalid request data or client not found
            summary: Add product to cart
            tags:
                - Shopping Cart
    /cart/{cid}:
        get:
            description: Retrieves all products in a client's shopping cart
            operationId: getProducts
            parameters:
                - description: Client ID
                  example: "1234"
                  in: path
                  name: cid
                  required: true
                  schema:
                    type: string
                    x-user-hint: id
            responses:
                "200":
                    content:
                        text/plain:
                            example: '[Product = { id = 1234$0, name = coffee, quantity = 10, timestamp = 1760449181607, price = Price = { currency = EUR, amount = 1.000000 } }]'
                            schema:
                                type: string
                    description: Cart products retrieved successfully
                "404":
                    content:
                        text/plain:
                            example: 'Error, no such client: 1234'
                            schema:
                                type: string
                    description: Client not found
            summary: Get cart products
            tags:
                - Shopping Cart
    /memory:
        get:
            description: Returns the current memory usage of the application in KB
            operationId: getMemory
            responses:
                "200":
                    content:
                        application/json:
                            example: 10240
                            schema:
                                description: Memory usage in KB
                                format: int64
                                type: integer
                    description: Memory usage retrieved successfully
            summary: Get memory usage
            tags:
                - System
servers:
    - description: Local development server
      url: http://localhost:8001
    - description: Production server
      url: http://localhost:8001
tags:
    - description: Operations for managing clients
      name: Clients
    - description: Operations for managing shopping cart and products
      name: Shopping Cart
    - description: System information endpoints
      name: System
